<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Руководство инструмента SHACCER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a12 0%, #1a0a2e 50%, #0d0221 100%);
            color: #e0e0ff;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .cover {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }
        
        .cover img {
            max-width: 100%;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(138, 43, 226, 0.4),
                        0 0 40px rgba(138, 43, 226, 0.2);
            transition: transform 0.3s ease;
        }
        
        .cover img:hover {
            transform: scale(1.02);
        }
        
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 30px 0 10px;
            background: linear-gradient(90deg, #fff, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #a78bfa;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        
        .chapters {
            background: rgba(20, 10, 40, 0.7);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        .chapters h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #c4b5fd;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            padding-bottom: 10px;
        }
        
        .chapter-list {
            list-style: none;
        }
        
        .chapter-list li {
            margin-bottom: 12px;
        }
        
        .chapter-list a {
            display: block;
            padding: 14px 18px;
            background: rgba(88, 28, 135, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.25);
            border-radius: 10px;
            color: #e0d4ff;
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .chapter-list a:hover {
            background: rgba(138, 43, 226, 0.35);
            border-color: #a78bfa;
            transform: translateX(6px);
            color: #fff;
        }
        
        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #7c6a9e;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: #a78bfa;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .cover img { width: 280px; }
            .chapters { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cover">
            <img src="/static/cover.png" alt="Обложка руководства SHACCER">
            <h1>Руководство инструмента SHACCER</h1>
            <p class="subtitle">Полный гид по возможностям инструмента</p>
        </div>
        
        <div class="chapters">
            <h2>Содержание</h2>
            <ul class="chapter-list">
                {% for chapter in chapters %}
                <li>
                    <a href="/chapter/{{ loop.index0 }}">
                        {{ chapter.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
        
        <div class="footer">
            <p>Электронная книга по 3D-платформе <strong>SHACCER</strong></p>
            <p>Сайт платформы: <a href="https://webtoshaccer.onrender.com/" target="_blank">webtoshaccer.onrender.com</a></p>
        </div>
    </div>
</body>
</html>
